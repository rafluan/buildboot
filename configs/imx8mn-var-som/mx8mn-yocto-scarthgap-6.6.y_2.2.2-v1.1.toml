# This file is the complete input for one board and one homologated release.
board = "imx8mn-var-som"
release = "mx8mn-yocto-scarthgap-6.6.y_2.2.2-v1.1"
[board_config]
soc = "iMX8MN"
memory = "ddr4"

[sources.uboot]
directory = "uboot-imx"
url = "https://github.com/varigit/uboot-imx"
branch = "lf_v2024.04_6.6.52-2.2.2_var01"
commit = "20760df8569b7e601191035b171f1a612e060355"
defconfig = "imx8mn_var_som_defconfig"

[sources.atf]
directory = "imx-atf"
url = "https://github.com/varigit/imx-atf"
branch = "lf_v2.10_6.6.52-2.2.2_var01"

[sources.mkimage]
directory = "imx-mkimage"
url = "https://github.com/varigit/imx-mkimage"
branch = "lf-6.6.52_2.2.2_var01"

[sources.optee]
directory = "imx-optee-os"
url = "https://github.com/nxp-imx/imx-optee-os.git"
branch = "lf-6.6.52_2.2.0"
commit = "ecea75b7fee5a3c8a2d9b99769ba78c4390c0e8b"

[sources.hab_certs]
directory = "var-hab-certs"
url = "https://github.com/varigit/var-hab-certs.git"
branch = "master"
commit = "0b2c9c39fbc5020b5faf8c7f1d0db5381c680785"

[firmware.ddr]
# This is the directory created by running the NXP self-extracting package.
directory = "firmware-imx"
package = "firmware-imx-8.26.1-410be01.bin"
url = "https://www.nxp.com/lgfiles/NMG/MAD/YOCTO/firmware-imx-8.26.1-410be01.bin"
files_glob = "firmware/ddr/synopsys/*"

[packaging]
soc = "iMX8MN"
atf_platform = "imx8mn"
dtb = "imx8mn-var-som-symphony.dtb"
target = "flash_ddr4_evk"
output = "imx-boot-sd.bin"
dd_seek_kib = 32

[hab]
certificates = "iMX8M"
csf_template = "configs/hab/csf_hab4.cfg"
serial = "1248163E"
keypass = "Variscite_password"

[encryption.dek-blob]
optee_board = "imx-mx8mnevk"
